# Everything this project does is a task below; `mise tasks` lists them.
# The upstream way stays as it is (Makefile, workflows); this adds the stack's
# tool for the release and the Fly deploy, so the fork needs nothing by hand.

[tools]
go = "1.27"
"packslip:github.com/joeblew999/dev" = { version = "0.4.1", pubkey = "RWQnLlj1BaHu39oBhUFxM3zEscQHqhxihLeTGyDAlavNFAOSTxQEHfoq" }   # the stack's tool; `dev` lists its verbs, its skill is .claude/skills/dev; pubkey: what its releases are signed with
goreleaser = "latest"
packslip = "latest"
gh = "latest"
flyctl = "latest"   # the showcase site deploys to Fly, as upstream does

[settings.skills]
auto_sync = true
prune = true

# Exact packslip pins are signature-checked; the 24h wait only ever held CI.
[settings]
minimum_release_age_excludes = ["packslip:*"]

# --- release: goreleaser from .goreleaser.yml (gsxui and stylegen), plus a
# packslip manifest that ships skills/gsxui. `mise run release <version>` tags,
# builds, signs with the key in fnox and publishes; release.yml runs the same
# on demand with the key from the Actions secret (mise run secrets:ci).

[tasks.release]
description = "publish a GitHub Release: <version>, signed with the key in fnox (--keygen makes it)"
raw = true
run = "dev release ."

[tasks."secrets:ci"]
description = "give this repo's GitHub Actions a secret from fnox: <name>... (PACKSLIP_SIGNING_KEY for signed releases, FLY_API_TOKEN for upstream's deploy)"
raw = true
run = "dev secrets ci"

[tasks."release:snapshot"]
description = "build the release, sign and verify its manifest, publish nothing"
run = "dev release . --snapshot"

# --- the showcase site on Fly (fly.toml at the root, site/Dockerfile), deployed
# from the repo root as upstream's workflow does.

[tasks."site:deploy"]
description = "deploy the site to Fly (FLY_API_TOKEN from fnox, or a flyctl login)"
run = "dev deploy ."

[tasks."site:url"]
description = "the deployed site's URL"
run = "dev url . --deployed"

[tasks."site:logs"]
description = "the deployed site's logs"
run = "dev logs ."

[tasks.test]
description = "Run checks the way CI does"
run = "make check"
